name: Desktop build verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac-arm64
            flags: --mac --arm64
          - os: macos-latest
            target: mac-x64
            flags: --mac --x64
          - os: windows-latest
            target: win-x64
            flags: --win --x64
          - os: ubuntu-latest
            target: linux-x64
            flags: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/check-packages.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-rollcall-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
