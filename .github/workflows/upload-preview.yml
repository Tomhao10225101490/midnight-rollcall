name: Upload verified preview packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable source build
        run: |
          gh api repos/$GH_REPO/actions/runs/43055992500 > run.json
          python3 -c "import json; r=json.load(open('run.json')); assert r['conclusion']=='success' and r['head_sha']=='d3e2941aebb233d598c51fe90f19aa0717fc0e82'"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43055992500
          path: artifacts/release-input
      - run: python3 scripts/verify-downloads.py artifacts/release-input
      - name: Upload only missing, verified assets to draft
        run: python3 scripts/upload-preview.py artifacts/release-input
